name: Rust

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4


    - name: Create Check
      run: |
          curl -L -X POST \
           -H "Accept: application/vnd.github+json" \
           -H "Authorization: Bearer $GH_TOKEN"\
           -H "X-GitHub-Api-Version: 2022-11-28" \
           https://api.github.com/repos/${{ github.repository }}/check-runs \
           -d '{"name":"Build with Rust and QBE", "head_sha":"${{ github.event.pull_request.head.sha }}", "status":"in_progress","output":{"title":"Placeholder"}}'

    - name: Fetch QBE
      run: git clone git://c9x.me/qbe.git
        
    - name: Build QBE
      working-directory: ./qbe
      run: make

    - uses: actions/checkout@v4
      with:
        repository: elmvel/Evec-Rust
        path: ./Evec-Rust
        
    - name: Build
      working-directory: ./Evec-Rust
      run: make debug
      
    - name: Run tests
      working-directory: ./Evec-Rust/tests/
      run: QBE_PATH=../../qbe/qbe ./rere.py replay test.list
